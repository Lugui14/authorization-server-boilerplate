spring:
  application:
    name: authorization-server

  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: authuser
    password: authpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope:
              - user:email
              - read:user

server:
  port: 8080

app:
  jwt:
    issuer: http://localhost:8080
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 604800
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081
  oauth2:
    authorized-redirect-uris:
      - http://localhost:8081/login/oauth2/code/client
      - http://localhost:3000/oauth2/redirect
  clients:
    - client-id: client
      client-secret: secret
      client-name: Default Web Client
      client-authentication-methods:
        - CLIENT_SECRET_BASIC
        - CLIENT_SECRET_POST
      authorization-grant-types:
        - AUTHORIZATION_CODE
        - REFRESH_TOKEN
        - CLIENT_CREDENTIALS
      redirect-uris:
        - http://localhost:8081/login/oauth2/code/client
        - http://localhost:3000/oauth2/redirect
      scopes:
        - openid
        - profile
        - email
        - read
        - write
      access-token-time-to-live-seconds: 3600
      refresh-token-time-to-live-seconds: 604800

jwt:
  keystore:
    path: ${JWT_KEYSTORE_PATH:authorization-server/src/main/resources/jwt-keystore.jks}
    password: ${JWT_KEYSTORE_PASSWORD:changeit}
  key:
    alias: ${JWT_KEY_ALIAS:jwt-key}
    password: ${JWT_KEY_PASSWORD:changeit}

logging:
  level:
    org.springframework.security: DEBUG
    com.luizguizl: DEBUG

