spring:
  application:
    name: resource-server

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
          jwk-set-uri: http://localhost:8080/oauth2/jwks

server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
    com.luizguizl: DEBUG

